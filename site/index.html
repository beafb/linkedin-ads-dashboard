<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkedIn Ads Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232a78d6' stroke-width='2.5' stroke-linecap='round'><path d='M4 20V12M10 20V6M16 20v-9M22 20H2'/></svg>">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body class="loading">
  <header class="top">
    <div class="title">
      <h1>LinkedIn Ads</h1>
      <p id="updated" class="muted">Loading the latest numbers…</p>
    </div>
    <div class="filters">
      <div id="accounts" class="seg" role="group" aria-label="Account"></div>
      <label class="field">Period
        <select id="range">
          <option value="7d">Last 7 days</option>
          <option value="30d">Last 30 days</option>
          <option value="month">This month</option>
          <option value="lastmonth">Last month</option>
          <option value="ytd">Year to date</option>
          <option value="launch">Since 3CC started</option>
          <option value="all">All time</option>
        </select>
      </label>
      <label class="field">Campaign <select id="campaign"></select></label>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button type="button" role="tab" id="tab-overview" data-tab="overview" aria-controls="panel-overview">Overview</button>
    <button type="button" role="tab" id="tab-ads" data-tab="ads" aria-controls="panel-ads">Ads</button>
    <button type="button" role="tab" id="tab-leads" data-tab="leads" aria-controls="panel-leads">Leads</button>
    <button type="button" role="tab" id="tab-sheet" data-tab="sheet" aria-controls="panel-sheet">Daily sheet</button>
  </nav>
  <main>
    <p id="error" class="error" role="alert" hidden></p>

    <section id="panel-overview" role="tabpanel" aria-labelledby="tab-overview">
      <div id="tiles" class="kpis">
        <div class="skeleton tile"></div><div class="skeleton tile"></div><div class="skeleton tile"></div><div class="skeleton tile"></div>
      </div>
      <div id="lead-warning" class="warning" role="status" hidden></div>
      <section class="block">
        <h2>From impression to deal</h2>
        <ol id="funnel" class="funnel"></ol>
      </section>
      <div class="charts">
        <figure class="card"><figcaption id="cap-leads">Leads</figcaption><div class="plot"><canvas id="chart-leads" role="img" aria-label="Leads over time"></canvas></div></figure>
        <figure class="card"><figcaption id="cap-cpl">Cost per lead</figcaption><div class="plot"><canvas id="chart-cpl" role="img" aria-label="Cost per lead over time, with the period average"></canvas></div></figure>
        <figure class="card wide"><figcaption id="cap-spend">Spend, by account</figcaption><div class="plot"><canvas id="chart-spend" role="img" aria-label="Spend over time, stacked by account"></canvas></div></figure>
      </div>
    </section>

    <section id="panel-ads" role="tabpanel" aria-labelledby="tab-ads" hidden>
      <div class="panel-head">
        <h2>Your ads</h2>
        <label class="switch"><input id="running-only" type="checkbox" checked> Running ads only</label>
      </div>
      <div class="sheet-wrap"><table id="ads-table" class="datatable ads-table"><thead></thead><tbody></tbody></table></div>
      <p id="ads-empty" class="empty" hidden></p>
    </section>

    <section id="panel-leads" role="tabpanel" aria-labelledby="tab-leads" hidden>
      <div class="panel-head"><h2>What happened to your leads</h2></div>
      <ol id="leads-funnel" class="funnel"></ol>
      <p id="leads-empty" class="empty" hidden>No leads in this period.</p>
      <div class="charts">
        <figure class="card"><figcaption id="cap-followup">Leads, by follow-up today</figcaption><div class="plot"><canvas id="chart-followup" role="img" aria-label="Leads over time, stacked by follow-up status"></canvas></div></figure>
        <figure class="card"><figcaption>Deals, by stage today</figcaption><div class="plot"><canvas id="chart-stages" role="img" aria-label="Number of deals per pipeline stage"></canvas></div></figure>
      </div>
      <div class="panel-head table-head">
        <h2>By campaign or ad</h2>
        <label class="field">Show
          <select id="lead-level">
            <option value="campaign">By campaign</option>
            <option value="ad">By ad</option>
          </select>
        </label>
      </div>
      <div class="sheet-wrap"><table id="lead-table" class="datatable"><thead></thead><tbody></tbody></table></div>
    </section>

    <section id="panel-sheet" role="tabpanel" aria-labelledby="tab-sheet" hidden>
      <div class="panel-head">
        <h2>Daily numbers</h2>
        <div class="sheet-tools">
          <label class="field">Show
            <select id="level">
              <option value="total">All combined</option>
              <option value="campaign">By campaign</option>
              <option value="ad">By ad</option>
            </select>
          </label>
          <button id="ad-chip" class="chip" type="button" hidden></button>
          <button id="csv" class="btn" type="button">Download CSV</button>
        </div>
      </div>
      <p id="sheet-empty" class="empty" hidden>No ads ran in this period.</p>
      <div class="sheet-wrap"><table id="sheet" class="datatable"><thead></thead><tbody></tbody></table></div>
    </section>
  </main>
</body>
</html>
